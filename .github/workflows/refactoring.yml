name: Refactoring Checks

on:
  pull_request:
    paths:
      - "src/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/refactoring.yml"
  push:
    paths:
      - "src/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/refactoring.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refactoring-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
